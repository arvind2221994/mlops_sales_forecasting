name: MLOps Training Pipeline

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "deployment/requirements.txt"
      - ".gitignore"
      - ".github/workflows/pipeline.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "deployment/requirements.txt"
      - ".gitignore"
      - ".github/workflows/pipeline.yml"
  workflow_dispatch:

concurrency:
  group: mlops-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python project
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            deployment/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r deployment/requirements.txt

      - name: Compile Python sources
        run: |
          python -m py_compile register_data.py prepare_data.py utils.py
          python -m py_compile scripts/*.py deployment/app.py

  train-compare-publish:
    name: Train, compare, and publish models
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_USERNAME: ${{ vars.HF_USERNAME }}
      HF_DATASET_NAME: ${{ vars.HF_DATASET_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Hugging Face configuration
        shell: bash
        run: |
          missing=0
          for variable in HF_TOKEN HF_USERNAME HF_DATASET_NAME; do
            if [ -z "${!variable}" ]; then
              echo "::error::$variable is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Clear previous model artifacts
        shell: bash
        run: |
          mkdir -p models reports
          rm -f models/*.joblib

      - name: Train, compare, and publish models
        run: python scripts/train_all_models.py --compare

      - name: Upload model and report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-training-${{ github.run_number }}
          path: |
            models/*.joblib
            reports/*
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated reports to main
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/model_comparison.csv reports/model_training_summary.md

          if git diff --cached --quiet; then
            echo "Generated reports are unchanged."
            exit 0
          fi

          git commit \
            -m "chore: update model comparison reports [skip ci]" \
            -m "Generated by the MLOps training workflow." \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
